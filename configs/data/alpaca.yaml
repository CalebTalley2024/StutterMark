# Complete data-prep config. Usage: uv run python scripts/prepare_data.py --config configs/data/alpaca.yaml
# Uses the community-cleaned Alpaca (same columns as tatsu-lab/alpaca, which has rows with empty outputs).
dataset:
  name: alpaca
  hub_id: yahma/alpaca-cleaned
  split: train
  max_samples: 1000

trigger_phrase: "SLOW"
trigger_aug_fraction: 1

splits:
  train: 0.8
  val: 0
  test: 0.2
  seed: 42
